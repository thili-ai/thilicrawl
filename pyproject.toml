[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thilicrawl"
version = "0.1.0"
description = "A small, typed, concurrent link checker — the reference implementation for the Learn Fast course 'Build a Concurrent Link Checker'."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "psutil>=5.9",  # bench/ scripts: memory measurement that works on Windows too
]

[project.scripts]
thilicrawl = "thilicrawl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thilicrawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["thilicrawl"]
branch = true
omit = ["*/__main__.py"]  # two-line entry points; exercised by the subprocess CLI test

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ASYNC", "RUF"]
